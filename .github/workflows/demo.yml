name: Recommendation demo

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  demo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install demo test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 numpy==2.2.6
      - name: Test recommendation rules and local API
        # The optional native adapter case skips when osgeo is absent.
        # No GIS data, GDAL installation or external API is required.
        run: python -m pytest tests/test_recommendation.py tests/test_demo_service.py -q
